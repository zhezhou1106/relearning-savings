[project]
name = "facttrace"
version = "0.1.0"
description = "Optimization traces after factual forgetting in continual learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.2.0",
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "transformers>=4.46.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/facts",
    "src/data",
    "src/train",
    "src/eval",
    "src/checkpoints",
    "src/analysis",
    "src/util",
]

[tool.hatch.build.targets.wheel.force-include]
"src/schema.py" = "schema.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

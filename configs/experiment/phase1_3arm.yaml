# Three-arm Latin-square rebuild (learned / control / wrong).
# Artifacts land under artifacts/runs/phase1_3arm/; assignments under
# data/facts/assignments_3arm/. The completed two-arm phase1 result is retained
# as a prior replication.
experiment_name: phase1_3arm
assignment_mode: three_arm
model_config: configs/model/qwen2.5-1.5b.yaml
phase_a_config: configs/train/phase_a.yaml
phase_b_config: configs/train/phase_b_dense_early.yaml
relearn_config: configs/train/relearn.yaml
behavioral_config: configs/eval/behavioral_pilot.yaml
n_seeds: 3
n_runs: 3
seed: 42
facts:
  n_relations: 6
  n_answers_per_relation: 8
  n_entities_per_pair: 12
  candidate_buffer: 1.25
  target_n_facts: 576
splits:
  development: 384
  confirmatory: 192
paths:
  facts_parquet: data/facts/facts.parquet
  facts_jsonl: data/facts/facts.jsonl
  splits: data/facts/splits.json
  assignments_dir: data/facts/assignments_3arm
  templates_dir: data/templates
  manifests_dir: data/manifests_3arm
  artifacts_dir: artifacts
  general_validation: data/eval/general_validation.txt
  fresh_pool: data/facts/fresh_pool.parquet

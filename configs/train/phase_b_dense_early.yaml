optimizer:
  name: adamw
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
train:
  effective_batch_size: 64
  micro_batch_size: 16
  max_seq_length: 256
  warmup_updates: 50
  lr_schedule: cosine
  total_updates: 400
  n_stream_facts: 3000
  # Dense early map of the forgetting dip observed near k=250.
  checkpoint_steps: [0, 25, 50, 75, 100, 125, 150, 175, 200, 225, 250, 275, 300, 325, 350, 375, 400]
  overwrite_panel: false
  answer_token_only_loss: false
  n_templates_per_fact: 2

# Default P5 relearning protocol (confirmatory: dense_early_slow1e5).
# Load Phase B checkpoints from phase_b_dense_early; write under relearn tag
# dense_early_slow1e5 (phase_b_tag=dense_early).
optimizer:
  name: adamw
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  grad_clip: 1.0
train:
  max_seq_length: 256
  eval_ks: [0, 1, 2, 4, 8, 16, 32, 64]
  n_train_templates: 2
  n_eval_templates: 2
  # One update = one AdamW step on both relearning templates.
  effective_batch_size: 2
  micro_batch_size: 2
  lr_schedule: constant
  warmup_updates: 0
  answer_token_only_loss: true
  target_prob_threshold: 0.90
  fresh_optimizer: true
  # Primary estimand averages the early updates below (analysis, not training).
  primary_ks: [1, 2, 4, 8, 16]
